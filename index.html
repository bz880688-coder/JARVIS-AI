<script>
// ===== JARVIS V4 - British Male Voice + Voice Commands =====

const output = document.getElementById("output");

// Speak with British Male Voice
function say(message){
  output.textContent = message;

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-GB";
  speech.rate = 0.88;
  speech.pitch = 0.75;
  speech.volume = 1;

  const voices = speechSynthesis.getVoices();

  // British Male voice preference
  const britishMale =
    voices.find(v =>
      v.lang.toLowerCase().startsWith("en-gb") &&
      /male|daniel|george|ryan|arthur|oliver/i.test(v.name)
    ) ||
    voices.find(v => v.lang.toLowerCase().startsWith("en-gb"));

  if(britishMale) speech.voice = britishMale;

  speechSynthesis.speak(speech);
}

// Live Clock
function updateClock(){
  const clock = document.getElementById("clock");
  if(clock){
    clock.textContent = new Date().toLocaleTimeString("en-GB");
  }
}
setInterval(updateClock,1000);
updateClock();

// Voice Recognition
function listen(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){
    say("Voice recognition is not supported.");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "en-GB";
  recognition.interimResults = false;
  recognition.continuous = false;

  output.textContent = "JARVIS LISTENING...";

  recognition.onresult = (e)=>{
    const command =
      e.results[0][0].transcript.toLowerCase();

    output.textContent = "YOU: " + command;
    handleCommand(command);
  };

  recognition.onerror = ()=>{
    output.textContent = "Microphone error.";
  };

  recognition.start();
}

// Voice Commands
function handleCommand(command){

  if(command.includes("hello") || command.includes("jarvis")){
    say("Hello Sir. How may I assist you?");
  }

  else if(command.includes("time")){
    say("The time is " + new Date().toLocaleTimeString("en-GB"));
  }

  else if(command.includes("date")){
    say("Today is " + new Date().toLocaleDateString("en-GB"));
  }

  else if(command.includes("youtube")){
    say("Opening YouTube.");
    window.open("https://youtube.com","_blank");
  }

  else if(command.includes("whatsapp")){
    say("Opening WhatsApp.");
    window.open("https://web.whatsapp.com","_blank");
  }

  else if(command.includes("instagram")){
    say("Opening Instagram.");
    window.open("https://instagram.com","_blank");
  }

  else if(command.includes("gmail")){
    say("Opening Gmail.");
    window.open("https://mail.google.com","_blank");
  }

  else{
    say("Command received, Sir.");
  }
}

// App buttons
function openSite(url){
  window.open(url,"_blank");
}

// Load voices after browser is ready
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = ()=>{};
}
</script>
